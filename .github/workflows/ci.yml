name: Verify gateway
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gateforge_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GATEFORGE_TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/gateforge_test?sslmode=disable
      GATEFORGE_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test -race -count=1 -timeout 120s ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - run: npm ci && npm test && npm run build
        working-directory: web
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Generate disposable stack credentials
        run: |
          printf 'POSTGRES_PASSWORD=%s\nREDIS_PASSWORD=%s\nGATEFORGE_ADMIN_TOKEN=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
          chmod 600 .env
      - run: docker compose --profile scale up --build -d --wait
      - name: Validate both gateways and backend failure
        run: |
          set -eu
          set -a; . ./.env; set +a
          mkdir -p .local/certs
          docker compose cp gateway:/certs/cert.pem .local/certs/cert.pem
          go run ./cmd/stackcheck
          docker compose stop users1
          sleep 3
          go run ./cmd/stackcheck
          docker compose start users1
          docker compose stop redis
          go run ./cmd/stackcheck -phase redis-down
          docker compose start redis
          docker compose --profile scale up -d --wait
          docker compose stop postgres
          go run ./cmd/stackcheck -phase database-down
      - name: Stop test containers
        if: always()
        run: docker compose --profile scale down
