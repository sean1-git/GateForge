name: Verify gateway
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GATEFORGE_TEST_REDIS_URL: redis://localhost:6379/0
      GATEFORGE_TEST_BACKUP_RESTORE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install PostgreSQL backup tools
        run: |
          set -eu
          . /etc/os-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Start isolated test services with fresh credentials
        run: |
          set -eu
          test_password=$(openssl rand -hex 32)
          echo "::add-mask::$test_password"
          printf 'GATEFORGE_TEST_DATABASE_URL=postgres://postgres:%s@127.0.0.1:5432/gateforge_test?sslmode=disable\n' "$test_password" >> "$GITHUB_ENV"
          docker run -d --name gateforge-ci-postgres -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD="$test_password" -e POSTGRES_DB=gateforge_test postgres:17-alpine
          docker run -d --name gateforge-ci-redis -p 127.0.0.1:6379:6379 redis:7.2-alpine
          for attempt in $(seq 1 30); do
            if docker exec gateforge-ci-postgres pg_isready -U postgres -d gateforge_test && docker exec gateforge-ci-redis redis-cli ping; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: go test -race -count=1 -timeout 120s ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - run: npm ci && npm test && npm run build
        working-directory: web
      - name: Stop isolated test services
        if: always()
        run: docker rm -f gateforge-ci-postgres gateforge-ci-redis
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Generate disposable stack credentials
        run: |
          printf 'POSTGRES_PASSWORD=%s\nREDIS_PASSWORD=%s\nGATEFORGE_ADMIN_TOKEN=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
          chmod 600 .env
      - run: docker compose --profile scale up --build -d --wait
      - name: Validate both gateways and backend failure
        run: |
          set -eu
          set -a; . ./.env; set +a
          mkdir -p .local/certs
          docker compose cp gateway:/certs/cert.pem .local/certs/cert.pem
          go run ./cmd/stackcheck
          docker compose stop users1
          sleep 3
          go run ./cmd/stackcheck
          docker compose start users1
          docker compose stop redis
          go run ./cmd/stackcheck -phase redis-down
          docker compose start redis
          docker compose --profile scale up -d --wait
          docker compose stop postgres
          go run ./cmd/stackcheck -phase database-down
      - name: Stop test containers
        if: always()
        run: docker compose --profile scale down
