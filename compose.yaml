name: gateforge

x-gateway: &gateway
  image: gateforge:local
  build: .
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  environment:
    DATABASE_URL: postgres://gateforge:${POSTGRES_PASSWORD:?Run scripts/setup-local.ps1 first}@postgres:5432/gateforge?sslmode=disable
    REDIS_URL: redis://:${REDIS_PASSWORD:?Run scripts/setup-local.ps1 first}@redis:6379/0
    GATEFORGE_ADMIN_TOKEN: ${GATEFORGE_ADMIN_TOKEN:?Run scripts/setup-local.ps1 first}
    GATEFORGE_TLS_CERT: /certs/cert.pem
    GATEFORGE_TLS_KEY: /certs/key.pem
  command: [-listen, "0.0.0.0:8443", -config, /app/configs/stack.json]
  volumes:
    - certs:/certs:ro
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    certgen: { condition: service_completed_successfully }
    users1: { condition: service_started }
    users2: { condition: service_started }
    orders: { condition: service_started }
    catalog: { condition: service_started }
  healthcheck:
    test: [CMD, /app/check, -url, "https://localhost:8443/readyz", -ca, /certs/cert.pem]
    interval: 10s
    timeout: 4s
    retries: 5
    start_period: 20s

x-backend: &backend
  image: gateforge:local
  build: .
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  entrypoint: [/app/echo]

services:
  gateway:
    <<: *gateway
    ports: ["127.0.0.1:8443:8443"]
  gateway2:
    <<: *gateway
    profiles: [scale]
    ports: ["127.0.0.1:8444:8443"]
  certgen:
    image: gateforge:local
    build: .
    entrypoint: [/bin/sh, -c]
    command: ["test -s /certs/cert.pem && test -s /certs/key.pem || exec /app/devcert -out /certs"]
    volumes: ["certs:/certs"]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateforge
      POSTGRES_USER: gateforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-local.ps1 first}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gateforge -d gateforge"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/setup-local.ps1 first}
    command: [/bin/sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction']
    volumes: ["redis-data:/data"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
  users1:
    <<: *backend
    command: [-listen, "0.0.0.0:9000", -name, users-1]
  users2:
    <<: *backend
    command: [-listen, "0.0.0.0:9000", -name, users-2]
  orders:
    <<: *backend
    command: [-listen, "0.0.0.0:9000", -name, orders]
  catalog:
    <<: *backend
    command: [-listen, "0.0.0.0:9000", -name, catalog, -cache-seconds, "30"]

volumes:
  certs:
  postgres-data:
  redis-data:
