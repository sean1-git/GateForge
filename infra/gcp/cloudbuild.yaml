# Manual build only; the GitHub-to-Cloud-Run trigger stays disabled.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args: [scripts/cloud-test-services.sh]
  - name: golang:1.27-alpine
    entrypoint: sh
    args:
      - -c
      - apk add --no-cache gcc musl-dev postgresql-client && . .cache/cloud-tests.env && go test -race -count=1 -timeout 120s ./... && go vet ./... && GATEFORGE_CAPACITY_TEST=1 go test -count=1 -timeout 120s -run '^TestCapacityWithTwoTLSGateways$' -v ./internal/app
  - name: node:24-alpine
    entrypoint: sh
    args: [-c, 'cd web && npm ci && npm test && npm run build']
  - name: gcr.io/cloud-builders/docker
    args: [rm, -f, gateforge-test-postgres, gateforge-test-redis]
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_IMAGE}', '.']
images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
